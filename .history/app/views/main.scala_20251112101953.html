@(title: String)(content: Html)

<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>@title</title>

    <!-- Globales CSS -->
    <link rel="stylesheet" href='@routes.Assets.versioned("stylesheets/main.css")'>
    <!-- Optional: Wenn du Bootstrap auch hier willst, einkommentieren:
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    -->

    <!-- Sternschnuppen CSS -->
    <link rel="stylesheet" href='@routes.Assets.versioned("stylesheets/stars.css")'>
  </head>
  <body>
    <!-- Hintergrund-Canvas (Sternschnuppen) -->
    <canvas id="stars-canvas" aria-hidden="true"></canvas>

    <div id="content" class="position-relative" style="z-index: 10;">
      @content
    </div>

    <!-- Optional: Bootstrap JS, falls oben eingebunden:
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    -->

    <!-- Sternschnuppen JS -->
    <script src='@routes.Assets.versioned("javascripts/stars.js")'></script>
  </body>
</html>
