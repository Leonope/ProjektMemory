@()

@main("Welcome to Play") {
  <!DOCTYPE html>
  <html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Memory Game!</title>

    <!-- Logout Button Styles (oben rechts) -->
    <style>
      .top-right-actions {
        position: fixed;
        top: 18px;
        right: 18px;
        z-index: 9999;
      }
      .logout-btn {
        background: rgba(220, 53, 69, 0.14);
        color: #ffb3bd;
        border: 1px solid rgba(255,255,255,0.14);
        border-radius: 10px;
        padding: 0.45rem 0.75rem;
        font-size: 0.9rem;
        cursor: pointer;
        backdrop-filter: blur(6px);
      }
      .logout-btn:hover {
        background: rgba(220, 53, 69, 0.22);
        border-color: rgba(255,255,255,0.22);
      }
    </style>
  </head>

  <body>
    <!-- ✅ Logout oben rechts -->
    <div class="top-right-actions">
      <button id="btnLogoutTop" type="button" class="logout-btn">Logout</button>
    </div>

    <div class="main-container">
      <div class="title">
        <span class="button-background"></span>
        <h1>Welcome to Memory Game!</h1>
      </div>

      <div class="button-container">
        <a href="@routes.HomeController.explanation" class="game-button">
          <button type="button">How to Play</button>
        </a>

        <!-- Start Game Button: Ziel wird per JS aus dem Dropdown gelesen -->
        <a href="#" id="startGameLink" class="game-button">
          <button type="button">Start Game</button>
        </a>
      </div>

      <!-- Dropdown zur Auswahl der Version (Dark Mode) -->
      <div class="version-selector" style="margin-top: 1.5rem; text-align: center;">
        <select id="gameVersionSelect" class="game-version-select">
          <option value="@routes.GameController.indexBootstrap.url">
            Bootstrap-Version (mit Features usw.)
          </option>
          <option value="@routes.VueGameController.index.url">
            Vue SPA Version
          </option>
          <option value="@routes.ReactGameController.index.url">
            React SPA Version
          </option>
          <option value="@routes.AngularGameController.index.url">
            Angular SPA Version
          </option>
        </select>
      </div>

      <!-- Live Session Counter + Details -->
      <div class="session-counter">
        <div id="liveSessionBox" class="live-session-box">
          <span class="live-session-label">
            Live Session Counter:
            <span id="sessionCount">0</span>
          </span>

          <button id="toggleSessionList"
                  type="button"
                  class="live-session-toggle">
            Details
          </button>
        </div>

        <!-- Session-Liste (wird per SSE gefüllt) -->
        <div id="sessionList" class="session-list" style="display:none; margin-top: 1rem;">
          <ul id="sessionListBody">
            <!-- z.B.: "abc123 : Alice, Bob" -->
          </ul>
        </div>
      </div>
    </div>

    <!-- Styles für das Dark-Mode-Dropdown -->
    <style>
      .game-version-select {
        background-color: #222;
        color: #f8f9fa;
        border: 1px solid #444;
        padding: 0.35rem 0.75rem;
        border-radius: 0.25rem;
        min-width: 260px;
      }
      .game-version-select:focus {
        outline: none;
        box-shadow: 0 0 0 0.15rem rgba(100, 181, 246, 0.4);
      }
      .game-version-select option {
        background-color: #222;
        color: #f8f9fa;
      }
    </style>

    <script type="text/javascript">
      document.addEventListener('DOMContentLoaded', function() {
        const countEl   = document.getElementById('sessionCount');
        const listBox   = document.getElementById('sessionList');
        const listBody  = document.getElementById('sessionListBody');
        const toggleBtn = document.getElementById('toggleSessionList');

        // ✅ Logout
        const logoutBtn = document.getElementById('btnLogoutTop');
        if (logoutBtn) {
          logoutBtn.addEventListener('click', async function() {
            try {
              await fetch('/auth/logout', {
                method: 'POST',
                credentials: 'same-origin',
                headers: { 'Csrf-Token': 'nocheck' }
              });
              window.location.href = '/login';
            } catch (e) {
              alert('Logout fehlgeschlagen: ' + (e && e.message ? e.message : e));
            }
          });
        }

        // --- Version-Auswahl & Start Game Button ---
        const versionSelect = document.getElementById('gameVersionSelect');
        const startLink     = document.getElementById('startGameLink');
        const defaultUrl    = '@routes.GameController.indexBootstrap.url';

        if (versionSelect && startLink) {
          startLink.addEventListener('click', function(e) {
            e.preventDefault();
            const target = versionSelect.value || defaultUrl;
            window.location.href = target;
          });
        }

        // --- Session-Liste ein-/ausklappen ---
        if (toggleBtn) {
          toggleBtn.addEventListener('click', function() {
            if (!listBox) return;
            if (listBox.style.display === 'none' || listBox.style.display === '') {
              listBox.style.display = 'block';
            } else {
              listBox.style.display = 'none';
            }
          });
        }

        // --- SSE-Verbindung zum Server (Server Sent Events) ---
        const source = new EventSource('@routes.SseController.sessionsStream');

        source.addEventListener('message', function(e) {
          try {
            const data = JSON.parse(e.data);
            const sessions = data.sessions || [];
            const count = (data.activeSessionCount != null)
              ? data.activeSessionCount
              : sessions.length;

            if (countEl) countEl.textContent = count;

            if (listBody) {
              listBody.innerHTML = '';
              sessions.forEach(function(sess) {
                const li = document.createElement('li');
                const sessionId = sess.sessionId || '–';
                let players = '–';
                if (sess.players && sess.players.length > 0) {
                  players = sess.players.join(', ');
                }
                li.textContent = sessionId + ' : ' + players;
                listBody.appendChild(li);
              });
            }

          } catch (err) {
            console.error('Fehler beim Verarbeiten der SSE-Daten:', err, e.data);
          }
        }, false);

        source.addEventListener('error', function(err) {
          console.error('SSE Fehler:', err);
        }, false);
      });
    </script>
  </body>
  </html>
}
