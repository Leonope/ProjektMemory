@(title: String)(content: Html)

<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>@title</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Dein globales CSS -->
    <link rel="stylesheet" href='@routes.Assets.versioned("stylesheets/main.css")'>

    <!-- Sternschnuppen CSS -->
    <link rel="stylesheet" href='@routes.Assets.versioned("stylesheets/stars.css")'>
  </head>
  <body class="bg-dark text-light">
    <!-- Hintergrund-Canvas (Sternschnuppen) -->
    <canvas id="stars-canvas" aria-hidden="true"></canvas>

    <nav class="navbar navbar-dark bg-dark position-relative" style="z-index: 10;">
      <div class="container">
        <a class="navbar-brand" href="/">Memory</a>
      </div>
    </nav>

    <main class="container py-4 position-relative" style="z-index: 10;">
      @content
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Sternschnuppen JS -->
    <script src='@routes.Assets.versioned("javascripts/stars.js")'></script>
  </body>
</html>
