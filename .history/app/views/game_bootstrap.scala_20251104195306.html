@(message: String)(implicit request: RequestHeader)
@import helper._

@main_bootstrap("Memory – Neues UI") {

  <h1 class="mb-4">Memory (Bootstrap-Version)</h1>

  <div class="alert alert-info">@message</div>

  <form action='@routes.GameController.newGameBootstrap' method="post" class="row g-3 mb-4">
    @CSRF.formField

    <div class="col-md-6">
      <label for="playerName" class="form-label">Name</label>
      <input id="playerName" name="playerName" type="text" class="form-control" placeholder="Dein Name">
    </div>

    <div class="col-md-6">
      <label for="pairs" class="form-label">Anzahl Paare</label>
      <input id="pairs" name="pairs" type="number" min="2" max="18" step="2" class="form-control" value="8">
    </div>

    <div class="col-12">
      <button type="submit" class="btn btn-primary">Neues Spiel starten</button>
    </div>
  </form>

  <div class="row row-cols-2 row-cols-sm-3 row-cols-md-4 row-cols-lg-6 g-2">
    @for(i <- 1 to 16) {
      <div class="col">
        <div class="card text-center p-4" style="background-color: var(--button-color);">
          <span class="fs-3">?</span>
        </div>
      </div>
    }
  </div>
}
