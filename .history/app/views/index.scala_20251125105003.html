@(implicit request: RequestHeader)

@main("Memory – Startseite") {

  <div class="text-center my-5">
    <h1 class="mb-3">Memory</h1>

    <p class="lead">
      Willkommen bei deiner Multiplayer-Memory-Version. Starte ein neues Spiel oder tritt mit einer Session-ID bei.
    </p>

    <!-- Live Session Counter -->
    <div id="liveSessionBox"
         class="mt-4 d-inline-block px-3 py-2 border rounded bg-dark bg-opacity-50">
      <span class="h5 mb-0">
        Live Session Counter:
        <span id="sessionCount">0</span>
      </span>
      <button id="toggleSessionList"
              type="button"
              class="btn btn-sm btn-outline-info ms-2">
        Details
      </button>
    </div>

    <!-- Session-Liste (ausklappbar) -->
    <div id="sessionList" class="mt-3" style="display:none;">
      <div class="card bg-secondary-subtle border-0">
        <div class="card-body p-2">
          <table class="table table-dark table-striped table-sm mb-0">
            <thead>
              <tr>
                <th>Session-ID</th>
                <th>Spieler</th>
              </tr>
            </thead>
            <tbody id="sessionListBody">
              <!-- Wird per SSE befüllt -->
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Navigation -->
    <div class="mt-4">
      <a href="@routes.GameController.indexBootstrap()" class="btn btn-primary me-2">
        Spiel starten
      </a>
      <a href="@routes.HomeController.explanation()" class="btn btn-outline-light">
        Erklärung
      </a>
    </div>
  </div>

  <script type="text/javascript">
    document.addEventListener('DOMContentLoaded', function() {
      const countEl   = document.getElementById('sessionCount');
      const listBox   = document.getElementById('sessionList');
      const listBody  = document.getElementById('sessionListBody');
      const toggleBtn = document.getElementById('toggleSessionList');

      // Ein-/Ausklappen der Sessionliste
      toggleBtn.addEventListener('click', function() {
        if (!listBox) return;
        if (listBox.style.display === 'none' || listBox.style.display === '') {
          listBox.style.display = 'block';
        } else {
          listBox.style.display = 'none';
        }
      });

      // SSE-Verbindung zum Server
      const source = new EventSource('@routes.SseController.sessionsStream()');

      // Standard-Event: "message"
      source.addEventListener('message', function(e) {
        try {
          const data = JSON.parse(e.data);
          const sessions = data.sessions || [];
          const count = (data.activeSessionCount != null)
            ? data.activeSessionCount
            : sessions.length;

          // Counter setzen
          countEl.textContent = count;

          // Tabelle neu aufbauen
          listBody.innerHTML = '';
          sessions.forEach(function(sess) {
            const tr = document.createElement('tr');

            const tdSession = document.createElement('td');
            tdSession.textContent = sess.sessionId || '–';
            tr.appendChild(tdSession);

            const tdPlayers = document.createElement('td');
            let players = '–';
            if (sess.players && sess.players.length > 0) {
              players = sess.players.join(', ');
            }
            tdPlayers.textContent = players;
            tr.appendChild(tdPlayers);

            listBody.appendChild(tr);
          });

        } catch (err) {
          console.error('Fehler beim Verarbeiten der SSE-Daten:', err, e.data);
        }
      }, false);

      source.addEventListener('error', function(err) {
        console.error('SSE Fehler:', err);
      }, false);
    });
  </script>
}
