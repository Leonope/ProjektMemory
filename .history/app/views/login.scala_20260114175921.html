@()

@main_bootstrap("Login") {

  <style>
    :root { color-scheme: dark; }

    body {
      background: #0b1020;
      color: #e7eaf3;
    }

    .auth-wrap {
      max-width: 560px;
      margin: 3.5rem auto;
      padding: 0 1rem;
    }

    .auth-card {
      background: rgba(16, 22, 44, 0.92);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 18px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.45);
      overflow: hidden;
    }

    .auth-header {
      padding: 1.25rem 1.25rem 0.75rem;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      background: linear-gradient(135deg, rgba(120, 88, 255, 0.16), rgba(0, 200, 255, 0.10));
    }

    .auth-header h1 {
      margin: 0;
      font-size: 1.4rem;
      letter-spacing: 0.2px;
    }

    .auth-sub {
      margin-top: 0.35rem;
      opacity: 0.8;
      font-size: 0.95rem;
    }

    .auth-body { padding: 1.25rem; }

    label {
      color: rgba(231, 234, 243, 0.85);
      font-size: 0.9rem;
    }

    .form-control {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      color: #e7eaf3;
    }

    .form-control:focus {
      background: rgba(255,255,255,0.08);
      border-color: rgba(120, 88, 255, 0.7);
      box-shadow: 0 0 0 0.2rem rgba(120, 88, 255, 0.25);
      color: #fff;
    }

    .divider {
      height: 1px;
      background: rgba(255,255,255,0.08);
      margin: 1.15rem 0;
    }

    .btn-primary {
      background: #7a5cff;
      border-color: #7a5cff;
    }
    .btn-primary:hover {
      background: #6a4cff;
      border-color: #6a4cff;
    }

    .btn-outline-light {
      border-color: rgba(255,255,255,0.22);
      color: rgba(255,255,255,0.92);
    }
    .btn-outline-light:hover {
      background: rgba(255,255,255,0.10);
      border-color: rgba(255,255,255,0.30);
      color: #fff;
    }

    .btn-dark {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.14);
    }
    .btn-dark:hover {
      background: rgba(255,255,255,0.12);
      border-color: rgba(255,255,255,0.18);
    }

    .oauth-grid { display: grid; gap: 0.6rem; }

    #msg { display:none; white-space: pre-wrap; border-radius: 12px; }
    .alert-danger { background: rgba(220, 53, 69, 0.12); color: #ffb3bd; border: 1px solid rgba(255,255,255,0.12); }

    .mfa-box {
      display:none;
      padding: 0.9rem;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.10);
      background: rgba(255,255,255,0.05);
    }

    .tiny {
      font-size: 0.85rem;
      opacity: 0.75;
    }
  </style>

  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-header">
        <h1>Login</h1>
        <div class="auth-sub">
          MFA ist erzwungen: Email muss verifiziert sein, dann wird SMS-2FA eingerichtet/abgefragt.
        </div>
      </div>

      <div class="auth-body">
        <div id="msg" class="alert alert-danger"></div>

        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input id="email" class="form-control" placeholder="Email" autocomplete="email">
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Passwort</label>
          <input id="password" type="password" class="form-control" placeholder="Passwort" autocomplete="current-password">
        </div>

        <div class="d-flex gap-2">
          <button id="btnLogin" class="btn btn-primary w-100" type="button">Login</button>
          <button id="btnSignup" class="btn btn-outline-light w-100" type="button">Registrieren</button>
        </div>

        <div class="divider"></div>

        <div class="oauth-grid">
          <button id="btnGithub" class="btn btn-dark w-100" type="button">Login mit GitHub</button>
          <button id="btnGoogle" class="btn btn-dark w-100" type="button">Login mit Google</button>
        </div>

        <div class="divider"></div>

        <!-- MFA UI -->
        <div id="mfaBox" class="mfa-box">
          <h2 class="h6 mb-2">SMS-2FA</h2>

          <div class="mb-2">
            <label for="phone" class="form-label">Telefonnummer (mit +49…)</label>
            <input id="phone" class="form-control" placeholder="+4917..." />
            <div class="tiny mt-1">
              Hinweis: Wenn du bereits 2FA eingerichtet hast, kann die Telefonnummer ignoriert werden (Resolver nutzt den hinterlegten Faktor).
            </div>
          </div>

          <div id="recaptcha-container" class="mb-2"></div>

          <div class="mb-2">
            <label for="sms" class="form-label">SMS-Code</label>
            <input id="sms" class="form-control" placeholder="123456" />
          </div>

          <div class="d-flex gap-2">
            <button id="btnSendSms" class="btn btn-outline-light w-100" type="button">SMS senden</button>
            <button id="btnVerifySms" class="btn btn-primary w-100" type="button">Code bestätigen</button>
          </div>
        </div>

        <div class="divider"></div>

        <button id="btnLogout" class="btn btn-outline-light w-100" type="button">Logout</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
    import {
      getAuth,
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      signInWithPopup,
      GithubAuthProvider,
      GoogleAuthProvider,
      signOut,
      sendEmailVerification,
      getMultiFactorResolver,
      multiFactor,
      PhoneAuthProvider,
      PhoneMultiFactorGenerator,
      RecaptchaVerifier
    } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCuwnkNgZQUQcTtJCSYkdu68bVGx7nxcaU",
      authDomain: "memory-e8ee2.firebaseapp.com",
      projectId: "memory-e8ee2",
      storageBucket: "memory-e8ee2.firebasestorage.app",
      messagingSenderId: "20108492270",
      appId: "1:20108492270:web:afe831b4449fc7cb2d22ff"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const msgEl = document.getElementById("msg");
    const mfaBox = document.getElementById("mfaBox");
    const emailEl = document.getElementById("email");
    const pwEl = document.getElementById("password");
    const phoneEl = document.getElementById("phone");
    const smsEl = document.getElementById("sms");

    let recaptchaVerifier = null;
    let mfaSession = null;            // enrollment session
    let verificationId = null;        // SMS verificationId
    let pendingResolver = null;       // sign-in resolver when MFA required

    function showError(text) {
      msgEl.style.display = "block";
      msgEl.textContent = text;
    }
    function clearError() {
      msgEl.style.display = "none";
      msgEl.textContent = "";
    }

    function showMfaUI() {
      mfaBox.style.display = "block";
      if (!recaptchaVerifier) {
        recaptchaVerifier = new RecaptchaVerifier(auth, "recaptcha-container", { size: "invisible" });
      }
    }

    async function exchangeTokenForCookie() {
      const user = auth.currentUser;
      const idToken = await user.getIdToken();

      const res = await fetch("/auth/session", {
        method: "POST",
        credentials: "same-origin",
        headers: {
          "Authorization": `Bearer ${idToken}`,
          "Csrf-Token": "nocheck"
        }
      });

      if (!res.ok) throw new Error(await res.text());
      window.location.href = "/";
    }

    async function enforceMfaAfterLogin(user) {
      // If email/password account -> require email verification BEFORE enrolling MFA
      const providerIds = (user.providerData || []).map(p => p.providerId);
      const isPasswordUser = providerIds.includes("password");

      if (isPasswordUser && !user.emailVerified) {
        try { await sendEmailVerification(user); } catch (_) { /* ignore */ }
        showError(
          "Bitte bestätige zuerst deine E-Mail-Adresse.\n" +
          "Wir haben dir gerade einen Verifizierungslink gesendet.\n\n" +
          "Danach: erneut einloggen – dann wird SMS-2FA eingerichtet."
        );
        // Stop flow here (no cookie, no MFA)
        return;
      }

      // If already enrolled -> proceed to cookie
      const enrolled = multiFactor(user).enrolledFactors;
      if (enrolled && enrolled.length > 0) {
        await exchangeTokenForCookie();
        return;
      }

      // Enrollment required
      showMfaUI();
      mfaSession = await multiFactor(user).getSession();
      showError("MFA erforderlich: Bitte Telefonnummer eingeben, SMS senden und Code bestätigen.");
    }

    async function handleAuthErrorMaybeMfa(err) {
      if (err?.code === "auth/multi-factor-auth-required") {
        showMfaUI();
        pendingResolver = getMultiFactorResolver(auth, err);
        showError("MFA erforderlich: Bitte SMS senden und Code bestätigen.");
        return true;
      }
      return false;
    }

    async function sendSms() {
      showMfaUI();

      const phoneAuthProvider = new PhoneAuthProvider(auth);

      if (pendingResolver) {
        // Sign-in flow: use first enrolled hint (phone factor)
        const hint = pendingResolver.hints[0];
        verificationId = await phoneAuthProvider.verifyPhoneNumber(
          { multiFactorHint: hint, session: pendingResolver.session },
          recaptchaVerifier
        );
      } else {
        // Enrollment flow: requires user input phone number + enrollment session
        const phoneNumber = phoneEl.value?.trim();
        if (!phoneNumber) throw new Error("Bitte Telefonnummer eingeben (z.B. +4917...)");
        if (!mfaSession) throw new Error("MFA Session fehlt. Bitte erneut einloggen.");

        verificationId = await phoneAuthProvider.verifyPhoneNumber(
          { phoneNumber, session: mfaSession },
          recaptchaVerifier
        );
      }

      showError("SMS gesendet. Bitte Code eingeben und bestätigen.");
    }

    async function verifySms() {
      const code = smsEl.value?.trim();
      if (!verificationId) throw new Error("Bitte zuerst SMS senden.");
      if (!code) throw new Error("Bitte SMS-Code eingeben.");

      const cred = PhoneAuthProvider.credential(verificationId, code);
      const assertion = PhoneMultiFactorGenerator.assertion(cred);

      if (pendingResolver) {
        // Finish sign-in
        const res = await pendingResolver.resolveSignIn(assertion);
        pendingResolver = null;
        await enforceMfaAfterLogin(res.user);
      } else {
        // Enroll second factor
        const user = auth.currentUser;
        await multiFactor(user).enroll(assertion, "SMS");
        await exchangeTokenForCookie();
      }
    }

    // --- Handlers ---
    document.getElementById("btnLogin").onclick = async () => {
      try {
        clearError();
        const res = await signInWithEmailAndPassword(auth, emailEl.value, pwEl.value);
        await enforceMfaAfterLogin(res.user);
      } catch (e) {
        if (!(await handleAuthErrorMaybeMfa(e))) showError(e?.message || String(e));
      }
    };

    document.getElementById("btnSignup").onclick = async () => {
      try {
        clearError();
        const res = await createUserWithEmailAndPassword(auth, emailEl.value, pwEl.value);
        await enforceMfaAfterLogin(res.user);
      } catch (e) {
        if (!(await handleAuthErrorMaybeMfa(e))) showError(e?.message || String(e));
      }
    };

    document.getElementById("btnGithub").onclick = async () => {
      try {
        clearError();
        const res = await signInWithPopup(auth, new GithubAuthProvider());
        await enforceMfaAfterLogin(res.user);
      } catch (e) {
        if (!(await handleAuthErrorMaybeMfa(e))) showError(e?.message || String(e));
      }
    };

    document.getElementById("btnGoogle").onclick = async () => {
      try {
        clearError();
        const res = await signInWithPopup(auth, new GoogleAuthProvider());
        await enforceMfaAfterLogin(res.user);
      } catch (e) {
        if (!(await handleAuthErrorMaybeMfa(e))) showError(e?.message || String(e));
      }
    };

    document.getElementById("btnSendSms").onclick = async () => {
      try { clearError(); await sendSms(); } catch (e) { showError(e?.message || String(e)); }
    };

    document.getElementById("btnVerifySms").onclick = async () => {
      try { clearError(); await verifySms(); } catch (e) { showError(e?.message || String(e)); }
    };

    document.getElementById("btnLogout").onclick = async () => {
      try {
        clearError();

        await fetch("/auth/logout", {
          method: "POST",
          credentials: "same-origin",
          headers: { "Csrf-Token": "nocheck" }
        });

        await signOut(auth);
        window.location.href = "/login";
      } catch (e) {
        showError(e?.message || String(e));
      }
    };
  </script>
}
