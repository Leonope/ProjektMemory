@(message: String, pairs: Int, playerName: String)(implicit request: RequestHeader)
@import helper._

@main_bootstrap("Memory – Neues UI") {

  <h1 class="mb-4 text-center">Memory (Bootstrap-Version)</h1>

  <div class="alert alert-info text-center">@message</div>

  <form action='@routes.GameController.newGameBootstrap' method="post" class="row g-3 mb-4 justify-content-center">
    @CSRF.formField

    <div class="col-12 col-md-4">
      <label for="playerName" class="form-label">Name</label>
      <input id="playerName" name="playerName" type="text" class="form-control"
             value='@playerName' placeholder="Dein Name">
    </div>

    <div class="col-12 col-md-4">
      <label for="pairs" class="form-label">Anzahl Paare</label>
      <input id="pairs" name="pairs" type="number" min="2" max="18" step="2" class="form-control" value='@pairs'>
    </div>

    <div class="col-12 text-center">
      <button type="submit" class="btn btn-primary px-4">Neues Spiel starten</button>
    </div>
  </form>

  <hr class="border-secondary mb-4">

  <div class="container">
    <div id="board"
         class="row row-cols-2 row-cols-sm-3 row-cols-md-4 row-cols-lg-6 g-2 g-md-3 justify-content-center">
      @for(i <- 1 to pairs * 2) {
        <div class="col">
          <div class="card text-center p-4 shadow-sm bg-secondary-subtle border-0"
               style="border-radius: 0.75rem; aspect-ratio: 1 / 1;">
            <span class="fs-3 fw-bold text-dark">?</span>
          </div>
        </div>
      }
    </div>
  </div>
}
