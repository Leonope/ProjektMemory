# https://www.playframework.com/documentation/latest/Configuration
play.filters.hosts {
  allowed = ["."]  # erlaubt alle Hosts
}
play.filters.headers {
  # Erlaube iframes von der gleichen Origin (http://localhost:9000, deine LAN-IP, ...)
  frameOptions = "SAMEORIGIN"
}
pekko.http.server.idle-timeout = 600s

play.server.http.idleTimeout  = 600 seconds
play.server.https.idleTimeout = 600 seconds

http.port = ${?PORT}

play.http.secret.key = ${?PLAY_HTTP_SECRET_KEY}

# Silhouette Module aktivieren (Guice)
#play.modules.enabled += "modules.SilhouetteModule"

github.clientID     = ${?GITHUB_CLIENT_ID}
github.clientSecret = ${?GITHUB_CLIENT_SECRET}
github.callbackURL  = ${?GITHUB_CALLBACK_URL}


silhouette.authenticator.cookie {
  name = "MEMORY_AUTH"
  secureCookie = false
  httpOnlyCookie = true
}




