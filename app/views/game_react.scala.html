@()

@main_bootstrap("Memory – React Version") {

  <!-- Karten-/Board-Styling wiederverwenden -->
  <link rel="stylesheet" href='@routes.Assets.versioned("stylesheets/memory.css")'>

  <div class="position-relative">
    <!-- Extra Canvas nur für die React-Seite: blaue Kometen -->
    <canvas id="react-comets-canvas"
            aria-hidden="true"
            style="position: fixed; inset: 0; z-index: 1; pointer-events: none;">
    </canvas>

    <!-- Root-Container für React-App (liegt über dem Canvas) -->
    <div id="react-root" class="position-relative" style="z-index: 10;">
      <!-- React-App wird hier gemountet -->
    </div>
  </div>

  <!-- React 18 UMD-Bundles -->
  <script src="https://unpkg.com/react@@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@@18/umd/react-dom.production.min.js"></script>

  <!--  React Memory-Logik -->
  <script src='@routes.Assets.versioned("javascripts/react-memory.js")'></script>

  <!-- Blaue Kometen: häufigere, auffällige Animation -->
  <script type="text/javascript">
    (function() {
      const canvas = document.getElementById('react-comets-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      if (!ctx) return;

      function resize() {
        canvas.width  = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      const comets = [];

      function spawnComet() {
        const startX = Math.random() * canvas.width;
        const startY = Math.random() * canvas.height * 0.3; // oben/oberer Bereich
        const speed  = 400 + Math.random() * 250;           // schnell
        const angle  = Math.PI * (0.6 + Math.random() * 0.08); // leicht diagonal
        const length = 120 + Math.random() * 180;           // langer Schweif

        comets.push({
          x: startX,
          y: startY,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 0,
          maxLife: 0.7 + Math.random() * 0.5, // Sekunden
          length
        });
      }

      let lastTime = performance.now();

      function update(dt) {
        for (let i = comets.length - 1; i >= 0; i--) {
          const c = comets[i];
          c.life += dt;
          if (c.life > c.maxLife) {
            comets.splice(i, 1);
            continue;
          }
          c.x += c.vx * dt;
          c.y += c.vy * dt;
        }
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        comets.forEach(c => {
          const t = c.life / c.maxLife;
          const alpha = 1 - t;

          // Endpunkt des Schweifs (kleines Stück zurück in Flugrichtung)
          const tailX = c.x - c.vx * 0.06;
          const tailY = c.y - c.vy * 0.06;

          // Schweif – kräftiges Blau
          ctx.strokeStyle = `rgba(86, 154, 255, ${alpha})`;
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(c.x, c.y);
          ctx.lineTo(tailX, tailY);
          ctx.stroke();

          // Kopf – heller, leuchtender Blaupunkt
          ctx.beginPath();
          ctx.fillStyle = `rgba(173, 208, 255, ${alpha})`;
          ctx.arc(c.x, c.y, 4, 0, Math.PI * 2);
          ctx.fill();
        });
      }

      function loop(now) {
        const dt = (now - lastTime) / 1000;
        lastTime = now;

        // Häufige Kometen-Spawns
        if (comets.length < 25 && Math.random() < 0.12) {
          spawnComet();
        }

        update(dt);
        draw();
        requestAnimationFrame(loop);
      }

      requestAnimationFrame(loop);
    })();
  </script>
}
